<!DOCTYPE html>
<html>
<head>
  <title>Brain MRI Tumor Classifier</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f4f8;
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    h2 {
      margin: 0 0 8px 0;
      font-size: 24px;
      color: #0f172a;
    }
    p.subtitle {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .upload-btn {
      display: inline-block;
      background-color: #2563eb;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .upload-btn:hover {
      background-color: #1d4ed8;
    }
    input[type="file"] {
      display: none;
    }
    #mriPreview {
      display: none;
      margin: 24px auto 10px auto;
      width: 224px;
      height: 224px;
      object-fit: cover;
      border-radius: 12px;
      border: 3px solid #e2e8f0;
      background-color: #000;
    }
    #label-container {
      margin-top: 24px;
      text-align: left;
    }
    .result-row {
      margin-bottom: 14px;
    }
    .result-header {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .progress-bg {
      background-color: #e2e8f0;
      border-radius: 999px;
      height: 12px;
      overflow: hidden;
    }
    .progress-fill {
      background-color: #94a3b8;
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.5s ease-out;
    }
    .result-row.top-match .progress-fill {
      background-color: #2563eb;
    }
    .result-row.top-match .result-header {
      color: #1d4ed8;
    }
    .disclaimer {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
      font-size: 12px;
      color: #64748b;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Brain MRI Scan Analyzer</h2>
    <p class="subtitle">Select an MRI image file (.jpg or .png) to analyze:</p>
    
    <label for="imageUpload" class="upload-btn">Choose MRI Scan</label>
    <input type="file" id="imageUpload" accept="image/*" />
    
    <img id="mriPreview" width="224" height="224" />
    
    <div id="label-container"></div>

    <div class="disclaimer">
      <strong>Educational Prototype Only:</strong> This AI model is for demonstration and research purposes. It is not a certified medical device and should not be used for clinical diagnosis.
    </div>
  </div>

  <script type="text/javascript">
    const URL = "./";
    let model, labelContainer, maxPredictions;

    // 1. Load the model immediately when the page opens
    async function init() {
      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";
      model = await tmImage.load(modelURL, metadataURL);
      maxPredictions = model.getTotalClasses();

      labelContainer = document.getElementById("label-container");
    }

    // 2. Listen for a file upload and run prediction on the image
    document.getElementById("imageUpload").addEventListener("change", async function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const img = document.getElementById("mriPreview");
      img.src = window.URL.createObjectURL(file);
      img.style.display = "block";

      img.onload = async function() {
        // Note: flipped is set to false since MRI scans shouldn't be mirrored
        const prediction = await model.predict(img, false);
        
        // Sort predictions from highest confidence to lowest
        prediction.sort((a, b) => b.probability - a.probability);

        labelContainer.innerHTML = "";
        for (let i = 0; i < maxPredictions; i++) {
          const percent = (prediction[i].probability * 100).toFixed(1);
          const isTop = i === 0 ? "top-match" : "";

          const row = document.createElement("div");
          row.className = `result-row ${isTop}`;
          row.innerHTML = `
            <div class="result-header">
              <span>${prediction[i].className}</span>
              <span>${percent}%</span>
            </div>
            <div class="progress-bg">
              <div class="progress-fill" style="width: ${percent}%"></div>
            </div>
          `;
          labelContainer.appendChild(row);
        }
      };
    });

    init();
  </script>
</body>
</html>
