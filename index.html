<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain MRI Tumor Classifier</title>
  <script src="https://jsdelivr.net"></script>
  <script src="https://jsdelivr.net"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f4f8;
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
      color: #0f172a;
    }
    p.subtitle {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 20px;
    }
    #status {
      font-size: 13px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 8px;
      background-color: #e0f2fe;
      color: #0369a1;
      margin-bottom: 20px;
    }
    .upload-btn {
      display: inline-block;
      background-color: #2563eb;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .upload-btn:hover {
      background-color: #1d4ed8;
    }
    .upload-btn.disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    input[type="file"] {
      display: none;
    }
    #mriPreview {
      display: none;
      margin: 24px auto 10px auto;
      width: 224px;
      height: 224px;
      object-fit: cover;
      border-radius: 12px;
      border: 3px solid #e2e8f0;
      background-color: #000;
    }
    #label-container {
      margin-top: 24px;
      text-align: left;
    }
    .result-row {
      margin-bottom: 14px;
    }
    .result-header {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .progress-bg {
      background-color: #e2e8f0;
      border-radius: 999px;
      height: 12px;
      overflow: hidden;
    }
    .progress-fill {
      background-color: #94a3b8;
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.5s ease-out;
    }
    /* Highlight the top prediction in blue */
    .result-row.top-match .progress-fill {
      background-color: #2563eb;
    }
    .result-row.top-match .result-header {
      color: #1d4ed8;
    }
    .disclaimer {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
      font-size: 12px;
      color: #64748b;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Brain MRI Analyzer</h1>
    <p class="subtitle">Upload an axial brain MRI scan (.jpg or .png) to classify tumor types.</p>

    <div id="status">Loading AI model...</div>

    <label for="imageUpload" id="uploadLabel" class="upload-btn disabled">Choose MRI Scan</label>
    <input type="file" id="imageUpload" accept="image/*" disabled />

    <img id="mriPreview" alt="MRI Preview" />

    <div id="label-container"></div>

    <div class="disclaimer">
      <strong>Educational Prototype Only:</strong> This AI model is for demonstration and research purposes. It is not a certified medical device and should not be used for clinical diagnosis.
    </div>
  </div>

  <script type="text/javascript">
    const URL = "./";
    let model, maxPredictions;
    const statusBox = document.getElementById("status");
    const uploadInput = document.getElementById("imageUpload");
    const uploadLabel = document.getElementById("uploadLabel");
    const labelContainer = document.getElementById("label-container");

    async function init() {
      try {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";
        
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        statusBox.innerText = "Model ready — select an MRI scan to analyze";
        statusBox.style.backgroundColor = "#dcfce7";
        statusBox.style.color = "#15803d";
        
        uploadInput.disabled = false;
        uploadLabel.classList.remove("disabled");
      } catch (error) {
        statusBox.innerText = "Error loading model: " + error.message;
        statusBox.style.backgroundColor = "#fee2e2";
        statusBox.style.color = "#b91c1c";
      }
    }

    uploadInput.addEventListener("change", function(event) {
      const file = event.target.files;
      if (!file) return;

      statusBox.innerText = "Analyzing MRI scan...";
      statusBox.style.backgroundColor = "#e0f2fe";
      statusBox.style.color = "#0369a1";

      const img = document.getElementById("mriPreview");
      img.src = window.URL.createObjectURL(file);
      img.style.display = "block";

      img.onload = async function() {
        const predictions = await model.predict(img, false);
        
        // Sort results from highest confidence to lowest
        predictions.sort((a, b) => b.probability - a.probability);

        // Clear previous results and build progress bars
        labelContainer.innerHTML = "";
        predictions.forEach((pred, index) => {
          const percent = (pred.probability * 100).toFixed(1);
          const isTop = index === 0 ? "top-match" : "";

          const row = document.createElement("div");
          row.className = `result-row ${isTop}`;
          row.innerHTML = `
            <div class="result-header">
              <span>${pred.className}</span>
              <span>${percent}%</span>
            </div>
            <div class="progress-bg">
              <div class="progress-fill" style="width: ${percent}%"></div>
            </div>
          `;
          labelContainer.appendChild(row);
        });

        statusBox.innerText = "Analysis complete";
        statusBox.style.backgroundColor = "#dcfce7";
        statusBox.style.color = "#15803d";
      };
    });

    init();
  </script>

</body>
</html>
